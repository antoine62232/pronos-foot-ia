name: Mise a jour resultats CdM

# schedule = autopilote (heure UTC) ; workflow_dispatch = bouton manuel pour tester
on:
  workflow_dispatch:
  schedule:
    - cron: "0 */2 * * *"

# necessaire pour que le job puisse committer le CSV dans le repo
permissions:
  contents: write

jobs:
  maj-resultats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests pandas

      - name: Lancer le robot
        env:
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
        run: python scripts/maj_resultats.py

      - name: Commit si le fichier a change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/resultats_reels.csv
          if git diff --staged --quiet; then
            echo "Aucun nouveau resultat, rien a committer."
          else
            git commit -m "Maj resultats reels (auto)"
            git push
          fi